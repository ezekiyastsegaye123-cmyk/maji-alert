services:
  # Unified Web Service (Express Frontend + FastAPI ML Engine in one container)
  - type: web
    name: fradscr-drought-predictor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt # Low latency to East Africa
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ML_SERVICE_URL
        value: http://127.0.0.1:8000
      - key: ML_REQUEST_TIMEOUT_MS
        value: 15000
      - key: CALIBRATION_TEMPERATURE
        value: "0.35"
      - key: CORS_ORIGIN
        value: "*"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "60"
      - key: MONGODB_URI
        sync: false # Set via Render dashboard or connect to MongoDB Atlas
