# ==============================================================================
# Production Nginx Virtual Host for fradscr.pro.et
# ==============================================================================

upstream fradscr_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 1. HTTP -> HTTPS Auto-Redirect & ACME Challenge
server {
    listen 80;
    listen [::]:80;
    server_name fradscr.pro.et www.fradscr.pro.et;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Secure Proxy with WebSocket Support
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fradscr.pro.et www.fradscr.pro.et;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/fradscr.pro.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fradscr.pro.et/privkey.pem;

    # Modern Security Protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS Protection
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy root to Express App & Socket.io
    location / {
        proxy_pass http://fradscr_backend;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Static caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2)$ {
        proxy_pass http://fradscr_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
