# fly.toml app configuration file for FRADSCR
app = "fradscr-drought-predictor"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  ML_SERVICE_URL = "http://127.0.0.1:8000"
  ML_REQUEST_TIMEOUT_MS = "15000"
  CALIBRATION_TEMPERATURE = "0.35"
  CORS_ORIGIN = "*"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "25s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/health"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
