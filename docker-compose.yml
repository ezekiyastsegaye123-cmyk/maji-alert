services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Service (Audit Logging & Query Cache)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: fradscr-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: fradscr
    volumes:
      - mongo_data:/data/db
    networks:
      - fradscr_internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Python ML Microservice (FastAPI + In-Memory Random Forest Engine)
  # ----------------------------------------------------------------------------
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: fradscr-ml-service
    restart: unless-stopped
    environment:
      - PORT=8000
    networks:
      - fradscr_internal
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 25s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 3. Node.js Express Gateway & Socket.io Web Application
  # ----------------------------------------------------------------------------
  web-app:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: fradscr-web-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - LOG_LEVEL=info
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_REQUEST_TIMEOUT_MS=15000
      - MONGODB_URI=mongodb://mongodb:27017/fradscr
      - CORS_ORIGIN=*
    depends_on:
      ml-service:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - fradscr_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 4. Production Nginx Reverse Proxy (SSL/TLS, Gzip, Rate Limiting, DDoS Shield)
  # ----------------------------------------------------------------------------
  reverse-proxy:
    image: nginx:1.25-alpine
    container_name: fradscr-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      web-app:
        condition: service_healthy
    networks:
      - fradscr_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 5. Let's Encrypt Certbot (Automated SSL/TLS Certificate Provisioning)
  # ----------------------------------------------------------------------------
  certbot:
    image: certbot/certbot
    container_name: fradscr-certbot
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"
    networks:
      - fradscr_internal

networks:
  fradscr_internal:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  certbot_etc:
    driver: local
  certbot_var:
    driver: local
  certbot_www:
    driver: local
